plugins {
    id "com.android.application"
    // Even though our activity is Java, we NEED this because most plugins use Kotlin
    id "org.jetbrains.kotlin.android" 
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.example.public_safety_app"
    compileSdk 34

    defaultConfig {
        applicationId "com.example.public_safety_app"
        minSdkVersion flutter.minSdkVersion
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        multiDexEnabled true 
    }
    
    // Add this block to ensure Java 17 compatibility
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
dependencies {
    // Leave this empty or with just standard test implementation
}
